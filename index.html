<style>
/* ================= 1. WARNA DAN FONT (ubah di sini) ================= */
:root{--bg:#F8FAFC;--card:#fff;--ink:#172033;--mute:#4B5668;--line:#E2E8F0;--teal:#0F766E;--teal-d:#0B5F58;--teal-l:#E3F4F1;--orange:#F97316;--ok:#166534;--okb:#DCF3E4;--no:#B91C1C;--nob:#FBE5E5;--warn:#92400E;--warnb:#FFF1D6;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
/* ================= 2. DASAR ================= */
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--font);-webkit-text-size-adjust:100%}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}.nar{max-width:760px}
h1,h2,h3,p{margin:0}p{margin-bottom:12px}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
h1{font-size:clamp(1.6rem,4.5vw,2.6rem);line-height:1.15;letter-spacing:-.02em;font-weight:800}
h2{font-size:1.3rem;font-weight:800;margin:16px 0 8px}h3{font-size:1.05rem;margin:14px 0 6px}
.sub{color:var(--mute)}
mark{background:linear-gradient(transparent 58%,#FFE08A 58%);color:inherit;padding:0 2px}
code{font-family:Consolas,"Courier New",monospace;background:#EEF2F6;padding:1px 6px;border-radius:5px;font-size:.93em;word-break:break-all}
ul,ol{margin:0 0 12px;padding-left:22px}li{margin-bottom:6px}
/* ================= 3. HEADER ================= */
.hd{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo svg{width:36px;height:36px;flex:none}.logo b{display:block;font-size:1.1rem;line-height:1.1;color:var(--teal)}
.logo small{display:block;font-size:.75rem;color:var(--mute);line-height:1.3}
.tl{display:flex;gap:8px}
/* ================= 4. TOMBOL DAN FORM ================= */
.btn,.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;font:700 1rem var(--font);cursor:pointer;border:2px solid var(--teal);background:var(--teal);color:#fff;text-decoration:none}
.btn:hover{background:var(--teal-d)}
.bt{background:var(--card);color:var(--teal)}.bt:hover{background:var(--teal-l)}
.btn.off{background:#E5E7EB;border-color:#E5E7EB;color:#5B6674;cursor:not-allowed}
.sm{min-height:40px;padding:0 14px;font-size:.92rem}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
label{display:block;font-weight:700;margin-bottom:2px}
input[type=text],input[type=number]{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;margin:2px 0 14px;background:#fff;color:var(--ink)}
.ck{display:flex;gap:10px;align-items:center;font-weight:600;margin:12px 0}.ck input{width:22px;height:22px}
/* ================= 5. HERO + KARTU ================= */
.hero{padding:36px 0 24px}.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
.pill{display:inline-block;background:var(--teal-l);color:var(--teal-d);font-weight:600;font-size:.88rem;padding:5px 14px;border-radius:999px;margin-bottom:14px}
h1 span{color:var(--teal);background:linear-gradient(transparent 82%,var(--orange) 82%,var(--orange) 92%,transparent 92%)}
.lead{color:var(--mute);margin:14px 0 22px;max-width:46ch;font-size:1.08rem}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:20px;color:var(--mute);font-size:.95rem}.facts b{display:block;color:var(--ink);font-size:1.2rem;line-height:1.2}
.art{justify-self:center;width:100%;max-width:330px}.art svg{width:100%;height:auto;display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(23,32,51,.06);margin-bottom:14px}
.cards .card{margin:0}.ic{width:46px;height:46px;border-radius:12px;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;margin-bottom:12px}.ic svg{width:25px;height:25px}
.tag{display:inline-block;margin-top:10px;font-size:.82rem;font-weight:600;color:var(--teal-d);background:var(--teal-l);padding:3px 10px;border-radius:8px}
.note{background:var(--teal-l);border-radius:12px;padding:12px 16px;font-size:.97rem;margin:12px 0}
.ring{background:var(--teal-l);border-radius:12px;padding:12px 18px 4px;margin:16px 0}.ring h3{margin-top:0}
/* ================= 6. BILAH LANGKAH ================= */
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:16px 0;padding:0}
.steps button{min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font:600 .86rem var(--font);color:var(--mute);cursor:pointer}
.steps button.on{background:var(--teal);border-color:var(--teal);color:#fff}.steps button.dn{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.steps button[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
/* ================= 7. MATERI DAN LATIHAN ================= */
.main{padding:8px 0 56px}.prog{color:var(--mute);font-size:.9rem;margin-bottom:6px}
.case{background:var(--warnb);border-left:5px solid #D9A400;border-radius:6px;padding:14px 18px;margin:12px 0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
table{width:100%;min-width:480px;border-collapse:collapse;font-size:.93rem}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--teal-l)}
td.l{background:var(--nob)}td.m{background:var(--warnb)}td.b{background:var(--okb)}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);font:500 1rem var(--font);cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--teal)}.opt.pick{border-color:var(--teal);background:var(--teal-l)}
.fb{border-radius:10px;padding:10px 14px;margin:10px 0}.fb.ok{background:var(--okb);color:var(--ok)}.fb.no{background:var(--nob);color:var(--no)}.fb.wr{background:var(--warnb);color:var(--warn)}
.err{color:var(--no);font-weight:600;min-height:1.4em}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.item .cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.item .cats button{min-height:40px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font:600 .88rem var(--font);cursor:pointer}
.n{display:inline-block;min-width:26px;height:26px;line-height:22px;text-align:center;border-radius:50%;border:2px solid var(--teal);font-weight:700;font-size:.85rem;margin-right:8px}
.gen{background:var(--teal-l);border-radius:12px;padding:14px;margin:10px 0}.gen code{display:block;font-size:1.02rem;margin:8px 0;padding:8px 10px}
.skor{font-size:2.4rem;font-weight:800;color:var(--teal);line-height:1.1}
.ov{background:var(--card);border:2px solid var(--teal);border-radius:16px;padding:20px;margin:16px 0}
.bukti{border:2px solid var(--teal);border-radius:16px;padding:18px 20px;background:#fff}
.bukti dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:10px 0}.bukti dt{color:var(--mute);font-weight:600}.bukti dd{margin:0;font-weight:700}
footer{padding:24px 0 40px;color:var(--mute);font-size:.9rem;border-top:1px solid var(--line)}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.art{max-width:240px;order:-1}.cards{grid-template-columns:1fr}.hero .btn,.row .btn{width:100%}body{font-size:16px}.row .btn,.row .bt{flex:1 1 auto}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<script>
/* ================= 8. PENGATURAN (ganti tautan di sini) ================= */
var LINK_PRETEST="#";    /* tempel tautan Google Form pretest di antara tanda kutip */
var LINK_POSTTEST="#";   /* tempel tautan Google Form posttest */
var NAMA="Risalatul Husna, PPG Calon Guru Informatika";
var STEPS=["materi-1","latihan-1","materi-2","latihan-2","materi-3","latihan-3"];

/* ================= 9. ISI (edit teks di sini) ================= */
var KATA="garasi lembut prasasti kelinci tumbuk senja jendela sungai bukit kapal lampu roti payung hutan cermin pasir tangga ladang pelita mangkuk gerbang selimut kabut ombak tungku anyaman biola cemara dermaga embun fajar gubuk harimau intan jembatan kandang lorong marmer nanas oasis pelangi radar sabun tirai ulir vulkan warung zebra anggur bantal cangkir dapur ember genta halte jangkar kompas lukisan meriam pagar rumput sepeda talenta ungu wajan zaitun atlas benteng cerobong delta elang fosil gelas harpa ikan jaring kulit lilin menara orbit pulau rakit sangkar tebing udara warna zamrud".split(" ");
var KAMUS=[["Kata sandi","Rangkaian karakter rahasia untuk membuktikan bahwa kamu pemilik akun."],["Frasa sandi","Kata sandi berupa beberapa kata yang dipilih acak (5 sampai 6 kata), dipisah tanda hubung."],["Generator","Alat yang menghasilkan kata atau karakter secara acak, sehingga hasilnya tidak ditentukan pikiran kita."],["Pengelola kata sandi","Aplikasi yang menyimpan banyak sandi dalam brankas terkunci. Kamu cukup mengingat satu sandi utama."],["Autentikasi dua langkah","Masuk akun dengan sandi ditambah faktor kedua, misalnya kode dari aplikasi autentikator."],["Kode OTP","Kode sekali pakai untuk memastikan kamu pemilik akun. Rahasia, jangan diberikan kepada siapa pun."],["Phishing","Penipuan lewat pesan palsu untuk mencuri sandi atau data."],["Data pribadi","Informasi yang mengenali dirimu, seperti nama lengkap, alamat, nomor ponsel, dan foto."]];
var MATERI={
1:{judul:"Kata Sandi dan Autentikasi Dua Langkah",tujuan:"kamu bisa membedakan sandi lemah dan kuat, mengelola sandi dengan aman, dan memahami autentikasi dua langkah.",
 kasus:"Dinda, siswa kelas X, memakai satu sandi, <code>Dinda2010</code>, untuk akun game, media sosial, dan surel sekolahnya. Suatu hari layanan game itu diretas dan sandinya bocor. Besoknya, seseorang masuk ke media sosial dan surel sekolah Dinda. Apa saja yang salah? Jawabannya ada di materi.",
 ring:"<ol><li>Sandi kuat itu panjang dan acak. Simbol tambahan bukan penentu.</li><li>Satu akun satu sandi, tidak dibagikan, disimpan di pengelola kata sandi, dan diganti saat ada tanda bocor.</li><li>Autentikasi dua langkah melindungi akun walau sandi bocor, dan kode OTP tidak diberikan kepada siapa pun.</li></ol>",
 bag:[
 {h:"Sandi lemah dan sandi kuat",acak:1,html:"<p>Penyerang memakai program yang mencoba ribuan sandi umum dalam sekejap. Sandi berisi nama, tahun lahir, atau urutan angka cepat tertebak, dan menambah simbol di ujungnya tidak banyak menolong.</p><div class='tw'><table><tr><th>Tingkat</th><th>Contoh (fiktif)</th><th>Alasan</th></tr><tr><td class='l'>Lemah</td><td><code>Budi123</code><br><code>Andi2008</code><br><code>Budi123!</code></td><td>Nama, tahun, dan urutan angka. Simbol tambahan tidak mengubah polanya</td></tr><tr><td class='m'>Lebih baik, belum ideal</td><td><code>Komet!Pisang7Awan#</code></td><td>Panjang dan tanpa data pribadi, tapi kata dipilih sendiri dengan pola yang bisa ditebak</td></tr><tr><td class='b'>Terbaik</td><td><code>jembatan-sungai-vulkan-meriam-benteng-sangkar</code><br><code>utqxR8H!KcqYPgKv</code></td><td>Frasa acak 6 kata, dan sandi acak buatan pengelola kata sandi</td></tr></table></div><p><mark>Kekuatan sandi datang dari panjang dan keacakan</mark>, bukan dari banyaknya simbol. Frasa sandi dibuat dari 5 sampai 6 kata yang diacak <b>generator</b>, bukan kata yang kamu pikirkan sendiri. Hindari lirik lagu dan kutipan. Coba generator peragaan ini:</p><h3>Kebiasaan yang menjaga sandi</h3><ul><li><b>Satu akun, satu sandi.</b> Kalau satu layanan bocor, penyerang mencoba sandi itu di layanan lain, jadi sandi yang sama <mark>membuka semua akunmu</mark>.</li><li><b>Jangan dibagikan</b>, bahkan kepada teman. Tindakan di akunmu dianggap tindakanmu.</li><li><b>Simpan di pengelola kata sandi</b>, yaitu aplikasi brankas yang membuatkan dan menyimpan sandi acak. Jangan menempel di monitor atau mengirimnya lewat chat.</li><li><b>Ganti sandi saat ada tanda bocor</b>: notifikasi masuk dari perangkat tak dikenal, aktivitas aneh, atau sandi terlihat orang lain. Pedoman keamanan terbaru tidak menyarankan ganti berkala tanpa alasan.</li></ul><div class='note'>Semua contoh fiktif. Jangan dipakai sebagai sandi aslimu.</div>",
  cek:{q:"Manakah yang lebih sulit ditebak?",o:["<code>Kopi!Hujan7Bulan#Pagi</code> (kata dipilih sendiri)","<code>kelinci-prasasti-ombak-gubuk-marmer-biola</code> (diacak generator)"],c:1,f:"Kata yang diacak generator jauh lebih sulit ditebak daripada kata pilihan sendiri, walau yang satunya ditambah simbol."}},
 {h:"Autentikasi dua langkah",html:"<p>Autentikasi dua langkah menambah satu lapisan lagi setelah sandi. Selain sandi, kamu membuktikan lewat <mark>faktor kedua</mark>, misalnya kode dari aplikasi autentikator, kode lewat pesan, atau kode cadangan. Kalau sandimu bocor, penyerang tetap tertahan karena tidak punya faktor kedua.</p><p>Kode yang kamu terima disebut <b>kode OTP</b>. Kode ini <mark>rahasia</mark>: tidak boleh diberikan kepada siapa pun, termasuk yang mengaku admin atau petugas layanan. Layanan yang sah tidak pernah meminta kode OTP lewat pesan.</p><p>Simpan juga <b>kode cadangan</b> di tempat aman, supaya kamu tetap bisa masuk kalau ponselmu hilang.</p>",
  cek:{q:"Seseorang mengaku admin mengirim pesan: “Akunmu sedang diverifikasi. Kirim kode 6 digit yang baru masuk ke ponselmu.” Apa yang kamu lakukan?",o:["Mengirim kode agar akunku aman","Tidak mengirim kode kepada siapa pun dan melaporkan pesannya"],c:1,f:"Kode OTP tidak pernah diminta oleh pihak yang sah. Jangan berikan, lalu laporkan pesannya."}}
 ]},
2:{judul:"Mengenali Phishing dan Penipuan Pesan",tujuan:"kamu bisa mengenali ciri pesan penipuan, memeriksanya dengan aman, dan tahu apa yang dilakukan kalau terlanjur mengklik.",
 kasus:"Raka menerima pesan: “Selamat! Akun gamemu terpilih mendapat skin gratis. Klik tautan ini dalam 10 menit dan masuk dengan akunmu.” Tautannya mirip situs game resmi, tapi alamatnya sedikit berbeda. Raka mengklik dan mengisi sandinya. Besoknya, akun game Raka tidak bisa dimasuki. Apa yang bisa Raka periksa sebelum mengklik?",
 ring:"<ol><li>Phishing memancing lewat desakan, hadiah, dan ancaman supaya kamu bertindak tanpa berpikir.</li><li>Periksa pengirim, tautan, isi, permintaan, dan lampiran sebelum mengklik.</li><li>Kalau curiga: jangan klik, periksa lewat jalur resmi, laporkan. Kalau terlanjur: ganti sandi dan beri tahu orang dewasa.</li></ol>",
 bag:[
 {h:"Apa itu phishing dan apa yang diperiksa",html:"<p><b>Phishing</b> adalah penipuan lewat pesan palsu (surel, SMS, chat, atau DM) yang menyamar sebagai pihak tepercaya untuk mencuri sandi, kode OTP, atau data lain. Penipu memancing lewat perasaan: <mark>mendesak</mark> (“dalam 10 menit”), <mark>hadiah</mark> (“kamu menang”), atau <mark>ancaman</mark> (“akun ditutup”). Tujuannya membuatmu bertindak cepat sebelum sempat berpikir.</p><p>Sebelum mengklik, periksa lima bagian ini:</p><div class='tw'><table><tr><th>Bagian</th><th>Yang diperiksa</th></tr><tr><td>Pengirim</td><td>Alamat atau nomornya. Nama bisa dipalsukan. Alamat yang mirip tapi tidak sama dengan yang resmi adalah tanda bahaya.</td></tr><tr><td>Tautan</td><td>Arahkan kursor atau tekan lama untuk melihat alamat sebenarnya. Teks tautan bisa berbeda dari tujuan aslinya.</td></tr><tr><td>Isi pesan</td><td>Mendesak, mengancam, menjanjikan hadiah, atau menyapa dengan sebutan umum seperti “Pengguna”.</td></tr><tr><td>Permintaan</td><td>Meminta sandi, kode OTP, atau data pribadi lewat pesan.</td></tr><tr><td>Lampiran</td><td>File yang tidak kamu minta dari pengirim yang tidak dikenal.</td></tr></table></div><div class='note'>Pesan yang sah jarang menyuruhmu buru-buru mengisi sandi lewat tautan.</div>",
  cek:{q:"Manakah yang lebih mencurigakan?",o:["Pesan A: “Tagihan akunmu jatuh tempo. Klik di sini dalam 1 jam atau akun diblokir.”","Pesan B: “Ada masuk dari perangkat baru. Kalau itu bukan kamu, buka aplikasi resminya dan periksa aktivitas akun.”"],c:0,f:"Pesan A mendesak dan mengancam supaya kamu mengklik. Pesan B menyuruhmu membuka aplikasi resmi sendiri, bukan lewat tautan."}},
 {h:"Apa yang dilakukan",html:"<p><b>Kalau pesannya mencurigakan:</b></p><ul><li>Jangan klik tautan, jangan buka lampiran, dan jangan balas.</li><li>Kalau ingin memastikan, buka aplikasi atau situs resmi dengan cara sendiri, bukan lewat tautan di pesan.</li><li>Jangan pernah memberikan sandi atau kode OTP.</li><li>Laporkan (lewat fitur lapor di aplikasi atau ke guru atau orang dewasa), lalu hapus.</li></ul><p><b>Kalau terlanjur mengklik atau mengisi data:</b> segera ganti sandi dari perangkat yang aman, keluarkan perangkat lain dari akun, ganti sandi di akun lain yang memakai sandi sama, aktifkan autentikasi dua langkah, dan beri tahu orang dewasa atau layanan terkait. <mark>Jangan malu melapor</mark>, karena makin cepat dilaporkan, makin kecil kerugiannya.</p>",
  cek:{q:"Kamu terlanjur mengisi sandi di situs palsu. Apa langkah pertama?",o:["Menunggu dulu, siapa tahu tidak terjadi apa-apa","Segera mengganti sandi dari perangkat yang aman"],c:1,f:"Segera tutup akses penyerang dengan mengganti sandi. Menunggu justru memberi waktu bagi penipu."}}
 ]},
3:{judul:"Privasi Akun dan Data Pribadi",tujuan:"kamu bisa menyebutkan data pribadi, mengatur privasi akun, dan menjaga data saat memakai perangkat bersama atau Wi-Fi umum.",
 kasus:"Salsa mengunggah foto berseragam dengan nama sekolah terlihat di profil yang terbuka untuk umum. Di bio-nya ada nomor ponsel. Tidak lama kemudian, orang asing mulai mengirim pesan yang menyebut nama sekolah dan jam pulangnya. Informasi apa saja yang membuat Salsa mudah dikenali?",
 ring:"<ol><li>Data pribadi, terutama bila digabung, bisa membuat orang asing menemukanmu.</li><li>Atur privasi akun: batasi yang melihat unggahan, matikan lokasi, dan batasi pesan dari orang asing.</li><li>Keluar dari akun di perangkat bersama, hati-hati dengan Wi-Fi umum, dan minta izin sebelum mengunggah foto orang lain.</li></ol>",
 bag:[

   if(W.c){var ok2=(on===s[2]);h+="<div class='item'><b>"+s[0]+"</b>: "+(on?"Aktif":"Nonaktif")+"<div class='fb "+(ok2?"ok":"no")+"'><b>"+(ok2?"✓ Tepat.":"✕ Kurang tepat.")+"</b> Sebaiknya "+(s[2]?"aktif":"nonaktif")+". "+s[3]+"</div></div>"}
   else h+="<div class='item'><b>"+s[0]+"</b><div class='sub'>"+s[1]+"</div><button type='button' class='opt "+(on?"pick":"")+"' style='margin:8px 0 0' role='switch' aria-checked='"+(on?"true":"false")+"' data-a='sw' data-v='"+i+"'>"+(on?"Aktif":"Nonaktif")+"</button></div>"});
  if(W.c)h+=nx();else h+="<div class='row'><button class='btn' type='button' data-a='sc'>Periksa pengaturan</button></div>"}
 else{var Q=U.u=U.u||{p:[],c:0},o2=U.uo=U.uo||sh(x.st.length);
  if(!Q.c){o2.forEach(function(k){var at=Q.p.indexOf(k);h+="<button type='button' class='opt "+(at>=0?"pick":"")+"' data-a='up' data-v='"+k+"'><span class='n'>"+(at>=0?at+1:"")+"</span>"+x.st[k]+"</button>"});h+="<div class='err'>"+U.err+"</div><div class='row'><button class='btn' type='button' data-a='uc'>Periksa urutan</button><button class='bt' type='button' data-a='ur'>Ulangi urutan</button></div>"}
  else{h+="<h3>Urutan yang benar</h3>";x.st.forEach(function(s,k){h+="<p><span class='n'>"+(k+1)+"</span>"+s+(Q.p[k]===k?" <b style='color:var(--ok)'>✓ sesuai</b>":" <span class='sub'>(urutanmu: "+(Q.p.indexOf(k)+1)+")</span>")+"</p>"});h+="<div class='note'>"+x.cat+"</div>"+nx()}}
 return h+"</div>"}

function fmt(ts){try{return new Date(ts).toLocaleString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return String(ts)}}
function dur(){return ST.mulai&&ST.selesai?Math.max(1,Math.round((ST.selesai-ST.mulai)/60000))+" menit":"-"}
function idn(){return ST.id||{nama:"(mode tinjau)",kelas:"-",absen:"-"}}
function teks(){var d=idn(),t="JagaAkun - Bukti Penyelesaian"+(TINJAU&&!ST.id?" (MODE TINJAU)":"")+"\nNama: "+d.nama+"\nKelas: "+d.kelas+"\nNo. absen: "+d.absen+"\nMulai: "+(ST.mulai?fmt(ST.mulai):"-")+"\nSelesai: "+(ST.selesai?fmt(ST.selesai):"-")+"\nDurasi: "+dur();[1,2,3].forEach(function(n){t+="\nSkor Latihan "+n+": "+(ST.skor[n]===undefined?"-":ST.skor[n]+"/100")});return t+"\n(Skor latihan, bukan nilai hasil belajar)"}
function penutup(){if(!ST.selesai&&ST.id){ST.selesai=Date.now();save()}var d=idn(),h="<div class='wrap nar main'><h1>Kamu sudah menyelesaikan JagaAkun</h1><p class='sub'>Ini kartu buktimu. Tangkap layar kartu ini atau salin teksnya, lalu kirim ke chat sesuai arahan gurumu.</p><div class='bukti'><b>JagaAkun · Bukti Penyelesaian"+(TINJAU&&!ST.id?" (MODE TINJAU)":"")+"</b><dl><dt>Nama</dt><dd>"+d.nama.replace(/</g,"&lt;")+"</dd><dt>Kelas</dt><dd>"+d.kelas.replace(/</g,"&lt;")+"</dd><dt>No. absen</dt><dd>"+d.absen+"</dd><dt>Mulai</dt><dd>"+(ST.mulai?fmt(ST.mulai):"-")+"</dd><dt>Selesai</dt><dd>"+(ST.selesai?fmt(ST.selesai):"-")+"</dd><dt>Durasi</dt><dd>"+dur()+"</dd>";
 [1,2,3].forEach(function(n){h+="<dt>Latihan "+n+"</dt><dd>"+(ST.skor[n]===undefined?"-":ST.skor[n]+" / 100")+"</dd>"});
 h+="</dl><div class='note' style='margin-bottom:0'>Skor latihan hanya untuk berlatih, bukan nilai hasil belajar.</div></div><div class='row'><button class='bt' type='button' data-a='salin'>Salin teks hasil</button><span id='cp' class='sub' role='status'></span></div>";
 h+="<div class='card' style='margin-top:16px'><h2 style='margin-top:0'>Langkah berikutnya</h2><p>Kerjakan posttest, lalu isi angket di akhir formulir.</p>"+linkBtn(LINK_POSTTEST,"Kerjakan posttest")+"</div><div class='card'><h2 style='margin-top:0'>Tiga hal yang perlu kamu ingat</h2><ol><li>Sandi kuat itu panjang dan acak, satu akun satu sandi, dan tidak dibagikan.</li><li>Waspadai pesan mendesak yang meminta sandi atau kode, dan laporkan.</li><li>Atur privasi akunmu dan jaga data pribadimu.</li></ol></div><div class='row'><button class='bt' type='button' data-a='go' data-v='materi-1'>Tinjau materi</button><button class='bt' type='button' data-a='hapus'>Hapus data saya</button></div><p class='sub' style='margin-top:10px'>Tombol Hapus data saya menghapus nama, kelas, dan kemajuan dari perangkat ini. Gunakan kalau kamu memakai perangkat bersama.</p></div>";return h}
function panel(){if(!U.pnl)return "";var k=U.pnl==="kamus";return "<div class='wrap nar'><div class='ov'><h2 style='margin-top:0'>"+(k?"Kamus istilah":"Bantuan")+"</h2>"+(k?KAMUS.map(function(e){return "<p><b>"+e[0]+".</b> "+e[1]+"</p>"}).join(""):"<ul><li>Ikuti urutan: baca materi, lalu kerjakan latihan.</li><li>Tahap berikutnya terbuka setelah tahap sebelumnya selesai.</li><li>Kalau jawabanmu belum tepat, baca penjelasannya dan coba lagi.</li><li>Kemajuanmu tersimpan di perangkat ini, jadi kalau tab tertutup kamu bisa lanjut lewat tautan yang sama.</li><li>Kalau halaman macet, muat ulang. Kemajuanmu tetap ada.</li></ul>")+"<button class='btn' type='button' data-a='pnl' data-v=''>Tutup</button></div></div>"}
function draw(h){var m=h.match(/^(materi|latihan)-(\d)$/),out="";
 if(h==="awal")out=awal();else if(h==="mulai")out=mulai();else if(m){U.n=+m[2];out=m[1]==="materi"?materi(U.n):lat(U.n)}else if(h==="penutup")out=penutup();else{location.hash="awal";return}
 app.innerHTML=panel()+out+"<footer><div class='wrap'>JagaAkun · Disusun oleh "+NAMA+" · Seminar Pendidikan Profesi Guru</div></footer>";
 var f=app.querySelector("h1,h2");if(f&&h!=="mulai"){f.setAttribute("tabindex","-1");f.focus({preventScroll:true})}}
function redraw(top){var h=location.hash.replace("#","")||"awal",y=window.scrollY;draw(h);window.scrollTo(0,top?0:y)}
function salin(){var t=teks(),el=document.getElementById("cp"),done=function(m){if(el)el.textContent=m};
 try{navigator.clipboard.writeText(t).then(function(){done("Teks disalin.")},function(){fb()})}catch(e){fb()}
 function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");done("Teks disalin.")}catch(e){done("Gagal menyalin. Tangkap layar saja.")}document.body.removeChild(a)}}

document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;
 var a=b.getAttribute("data-a"),v=b.getAttribute("data-v"),n=U.n,x,k;
 if(a==="pnl"){U.pnl=v||null;redraw(true)}
 else if(a==="go"){var i=STEPS.indexOf(v);if(i>=0&&!isOpen(i))return;location.hash=v}
 else if(a==="idok"){var nm=document.getElementById("f-nama").value.trim(),kl=document.getElementById("f-kelas").value.trim(),ab=parseInt(document.getElementById("f-absen").value,10),pr=document.getElementById("f-pre").checked,er=document.getElementById("fe");
  if(nm.length<3){er.textContent="Isi nama lengkapmu.";return}if(!kl){er.textContent="Isi kelasmu.";return}if(!(ab>=1&&ab<=99)){er.textContent="Isi nomor absen (1 sampai 99).";return}if(!pr){er.textContent="Centang dulu bahwa kamu sudah mengerjakan pretest.";return}
  ST.id={nama:nm,kelas:kl,absen:ab};ST.mulai=Date.now();ST.selesai=null;save();location.hash="materi-1"}
 else if(a==="cek"){U.cek[U.bag]=+v;redraw()}
 else if(a==="acak"){var w=[],j;for(j=0;j<6;j++)w.push(KATA[rnd(KATA.length)]);U.fr=w.join("-");redraw()}
 else if(a==="pv"){U.bag--;U.err="";redraw(true)}
 else if(a==="nx"){var M=MATERI[n],g=M.bag[U.bag];if(g.cek&&U.cek[U.bag]===undefined){U.err="Jawab cek cepat dulu.";redraw();return}
  if(U.bag===M.bag.length-1){ST.done["materi-"+n]=true;save();location.hash="latihan-"+n}else{U.bag++;U.err="";redraw(true)}}
 else if(a==="fin-l"){ST.done["latihan-"+n]=true;if(v!==null&&v!=="")ST.skor[n]=+v;save();location.hash=n<3?"materi-"+(n+1):"penutup"}
 else if(a==="kl"){var p=v.split("_"),ti=LAT[n].tahap[U.t],it=ti.it[+p[0]],D=U.k;
  if(+p[1]===it[1]){D.a[+p[0]]=+p[1];if(D.f[+p[0]]===undefined)D.f[+p[0]]=true;if(Object.keys(D.a).length===ti.it.length){var ok=0;for(k in D.f)if(D.f[k])ok++;U.sk[U.t]=Math.round(100*ok/ti.it.length)}}
  else{D.f[+p[0]]=false;D.m[+p[0]]=true}redraw()}
 else if(a==="td"){var R2=U.r,q2=R2.p.indexOf(+v);if(q2>=0)R2.p.splice(q2,1);else R2.p.push(+v);U.err="";redraw()}
 else if(a==="tc"){x=LAT[n].tahap[U.t];if(!U.r.p.length){U.err="Pilih minimal satu bagian dulu.";redraw();return}var tp=0,fp=0,tt=0;x.b.forEach(function(bb,i3){var on=U.r.p.indexOf(i3)>=0;if(bb[2])tt++;if(on&&bb[2])tp++;if(on&&!bb[2])fp++});U.sk[U.t]=Math.max(0,Math.round(100*(tp-fp)/tt));U.r.c=1;U.err="";redraw()}
 else if(a==="sw"){U.s2.v[+v]=U.s2.v[+v]?0:1;redraw()}
 else if(a==="sc"){x=LAT[n].tahap[U.t];var mt=0;x.st.forEach(function(s3,i4){if(U.s2.v[i4]===s3[2])mt++});U.sk[U.t]=Math.round(100*mt/x.st.length);U.s2.c=1;redraw()}
 else if(a==="up"){var Q=U.u,q=Q.p.indexOf(+v);if(q>=0)Q.p.splice(q,1);else Q.p.push(+v);redraw()}
 else if(a==="ur"){U.u.p=[];redraw()}
 else if(a==="uc"){x=LAT[n].tahap[U.t];if(U.u.p.length<x.st.length){U.err="Urutkan semua langkah dulu.";redraw();return}var m2=0;U.u.p.forEach(function(kk,i2){if(kk===i2)m2++});U.sk[U.t]=Math.round(100*m2/x.st.length);U.u.c=1;U.err="";redraw()}
 else if(a==="nt"){U.t++;U.k=U.p=U.u=U.uo=U.r=U.s2=null;redraw(true)}
 else if(a==="ulang"){U.t=0;U.sk=[];U.k=U.p=U.u=U.uo=U.r=U.s2=null;redraw(true)}
 else if(a==="salin"){salin()}
 else if(a==="hapus"){if(window.confirm("Hapus nama, kelas, dan kemajuanmu dari perangkat ini?")){ST={done:{},skor:{}};try{localStorage.removeItem(KEY)}catch(e){}location.hash="awal";route()}}
 else if(a==="reset"){if(window.confirm("Mulai dari awal? Kemajuanmu akan dihapus.")){ST={done:{},skor:{}};save();location.hash="awal";route()}}
});
route();
